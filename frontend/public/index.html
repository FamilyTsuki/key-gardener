 <!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Keyboard Survivor</title>
        <link
            rel="icon"
            href="/asset/img/favicon.jpg"
            sizes="32x32"
            type="image/jpg"
        />

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Noto+Color+Emoji&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="/asset/css/global.css" />
        <link rel="stylesheet" href="/asset/css/nav.css" />
        <link rel="stylesheet" href="/asset/css/flash.css" />
        <link rel="stylesheet" href="/asset/css/dialogue.css" />
        

        <script type="importmap">
            {
                "imports": {
                    "three": "/node_modules/three/build/three.module.js",
                    "three/addons/": "/node_modules/three/examples/jsm/",
                    "three/examples/jsm/": "/node_modules/three/examples/jsm/"
                }
            }
        </script>
    </head>

    <body>
        <div id="nav-container"></div>
        <div id="app"></div>
        <div id="page-transition"></div>
        <div id="global-loader" class="hidden">
            <div class="loader-content">
                charging<span class="dot">.</span><span class="dot">.</span><span class="dot">.</span>
            </div>
        </div>
        <script>
            if (window.location.pathname === "/game") {
                document.body.classList.add("in-game");
                document.addEventListener("DOMContentLoaded", function () {
                    var overlay = document.getElementById("page-transition");
                    if (overlay) overlay.classList.add("fade-in");
                });
            }
        </script>
        <script type="module" src="/src/main.js"></script>
    </body>
</html>
