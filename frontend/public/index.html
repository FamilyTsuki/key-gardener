 <!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" >
        <meta name="viewport" content="width=device-width, initial-scale=1.0" >
        <title>GAME_NAME_PLACEHOLDER</title>
        
        <!-- SSR Tags Placeholder -->
        <!-- SEO meta tags, OpenGraph, Twitter cards, and JSON-LD will be injected here by server.js -->
        <link
            rel="icon"
            href="/asset/img/favicon.webp"
            sizes="32x32"
            type="image/png"
        >

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Noto+Color+Emoji&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="/asset/css/global.css" >
        <link rel="stylesheet" href="/asset/css/nav.css" >
        <link rel="stylesheet" href="/asset/css/flash.css" >
        <link rel="stylesheet" href="/asset/css/dialogue.css" >
        <link rel="stylesheet" href="/asset/css/spellPopup.css" >
        <link rel="stylesheet" href="/asset/css/skillTree.css" >

        <script type="importmap">
            {
                "imports": {
                    "three": "/node_modules/three/build/three.module.js",
                    "three/addons/": "/node_modules/three/examples/jsm/",
                    "three/examples/jsm/": "/node_modules/three/examples/jsm/"
                }
            }
        </script>
        <script>
            window.GOOGLE_CLIENT_ID = "GOOGLE_CLIENT_ID_PLACEHOLDER";
            window.SUPPORT_EMAIL = "SUPPORT_EMAIL_PLACEHOLDER";
            window.GAME_NAME = "GAME_NAME_PLACEHOLDER";
        </script>
        <script src="https://accounts.google.com/gsi/client" async defer></script>
    </head>

    <body>
        <script>
            (function() {
                var savedTheme = localStorage.getItem("theme");
                if (savedTheme === "light") {
                    document.body.setAttribute("data-theme", "light");
                } else if (savedTheme === "dark") {
                    document.body.removeAttribute("data-theme");
                } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) {
                    document.body.setAttribute("data-theme", "light");
                }
            })();
        </script>
        <div id="nav-container"></div>
        <div id="app"></div>
        <div id="page-transition"></div>
        <div id="global-loader">
            <div class="loader-content">
                <div class="cyber-spinner"></div>
                <div class="loader-text">SYSTEM CHARGING...</div>
            </div>
        </div>
        <div id="mini-loader" class="hidden">
            <span class="dot">.</span><span class="dot">.</span><span class="dot">.</span>
        </div>
        <script>
            if (window.location.pathname === "/game") {
                document.body.classList.add("in-game");
                document.addEventListener("DOMContentLoaded", function () {
                    var overlay = document.getElementById("page-transition");
                    if (overlay) overlay.classList.add("fade-in");
                });
            }
        </script>
        <script src="/socket.io/socket.io.js"></script>
        <script type="module" src="/src/main.js"></script>
    </body>
</html>
